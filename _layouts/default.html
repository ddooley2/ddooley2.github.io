<!DOCTYPE html>
<html{% if page.homepage or page.field_notes %} class="field-notes-document"{% endif %}>

  {% include head.html %}

  <body{% if page.homepage %} class="homepage"{% elsif page.field_notes %} class="field-notes-page"{% endif %}>

    {% include header.html %}

    <div class="page-content{% if page.homepage or page.field_notes %} page-content-homepage{% endif %}">
      <div class="{% unless page.homepage or page.field_notes %}wrapper{% endunless %}">
        {{ content }}
      </div>
    </div>

    {% unless page.homepage or page.field_notes %}
      {% include footer.html %}
    {% endunless %}

  </body>

</html>
